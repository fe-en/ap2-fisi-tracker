<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Version C – Fokus · AP2 FISI Vorschau</title>
<link rel="stylesheet" href="assets/css/anki.css">
</head>
<body>
<div class="wrap study">
  <div class="bar" style="justify-content:space-between">
    <a href="versionen.html">← Versionen</a>
    <span id="count" class="sub" style="margin:0"></span>
    <a href="index.html">Zur App</a>
  </div>
  <div class="progressline"><i id="prog" style="width:0%"></i></div>
  <div class="flash">
    <div class="q" id="question"></div>
    <div class="a" id="answer" hidden></div>
  </div>
  <div class="bar center" id="showBar"><button class="primary" id="show" style="flex:1">Antwort zeigen <small>(Leertaste)</small></button></div>
  <div class="rate" id="rate" hidden>
    <button class="again" data-next>Wieder<small>&lt; 1 Min</small></button>
    <button data-next>Schwer<small>6 Min</small></button>
    <button class="good" data-next>Gut<small>10 Min</small></button>
    <button data-next>Leicht<small>4 Tage</small></button>
  </div>
  <p class="note center">Echte Fragen aus dem Bestand (Thema 1.1). Vorschau — es wird nichts gespeichert.</p>
</div>
<script>
  var cards = [
    ['Wer erstellt das Lastenheft und was ist dessen Hauptinhalt?', 'Der Auftraggeber (Kunde). Es beschreibt die Gesamtheit der Forderungen aus Sicht des Auftraggebers (Was soll gemacht werden?).'],
    ['Wer erstellt das Pflichtenheft?', 'Der Auftragnehmer (Entwickler/Systemhaus) auf Basis des Lastenhefts.'],
    ['Warum ist das Pflichtenheft für beide Vertragspartner rechtlich wichtig?', 'Es ist die vertragliche Grundlage der Umsetzung. Es beschreibt, „Wie" und „Womit" die Forderungen erfüllt werden und dient als Basis für die Abnahme.'],
    ['Was beschreibt der PUE-Wert?', 'Power Usage Effectiveness: Verhältnis der gesamten Energie eines Rechenzentrums zur Energie der IT selbst. Näher an 1 ist besser.']
  ];
  var i = 0, q = document.getElementById('question'), a = document.getElementById('answer'),
      rate = document.getElementById('rate'), showBar = document.getElementById('showBar');
  function render() {
    q.textContent = cards[i][0]; a.textContent = cards[i][1]; a.hidden = true;
    rate.hidden = true; showBar.hidden = false;
    document.getElementById('count').textContent = 'Karte ' + (i + 1) + ' von ' + cards.length;
    document.getElementById('prog').style.width = (i / cards.length * 100) + '%';
  }
  function show() { a.hidden = false; rate.hidden = false; showBar.hidden = true; }
  document.getElementById('show').addEventListener('click', show);
  document.querySelectorAll('[data-next]').forEach(function (b) {
    b.addEventListener('click', function () { i = (i + 1) % cards.length; render(); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space') { e.preventDefault(); a.hidden ? show() : (i = (i + 1) % cards.length, render()); }
  });
  render();
</script>
</body>
</html>
